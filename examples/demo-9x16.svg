<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" data-duration="6" data-fps="30">
  <!-- Exemple svgMaker : CSS @keyframes + SMIL dans le même fichier, rôles d'audit hook / final. -->
  <style>
    text { font-family: ui-monospace, Menlo, monospace; fill: #f0f0f0; text-anchor: middle; }
    .hook  { font-size: 84px; font-weight: 800; animation: rise .6s .1s cubic-bezier(.2,.8,.2,1) both; }
    .sub   { font-size: 44px; fill: #9a9a9a; animation: rise .6s .9s cubic-bezier(.2,.8,.2,1) both; }
    .final { font-size: 54px; font-weight: 800; fill: #ec2828; animation: rise .5s 3s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px) } to { opacity: 1; transform: none } }
  </style>
  <rect width="1080" height="1920" fill="#101010"/>
  <text x="540" y="520" class="hook" data-role="hook">SAME TREE.</text>
  <text x="540" y="600" class="sub">two ways to cut it</text>
  <line x1="140" y1="1180" x2="940" y2="1180" stroke="#3a3a3a" stroke-width="4"/>
  <circle cx="140" cy="1120" r="44" fill="#f0f0f0">
    <animate attributeName="cx" from="140" to="940" begin="0.5s" dur="2.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/>
  </circle>
  <text x="540" y="1380" class="final" data-role="final">DIFFERENT PREPARATION.</text>
</svg>
