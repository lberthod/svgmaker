<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svgMaker Studio</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1b18;--muted:#6f6a63;--line:#e6e2db;--soft:#efece6;
  --accent:#e2552d;--accent-ink:#fff;--ok:#2f9e5b;--warn:#c98a0b;--bad:#c8372d;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--panel:#1d1c1a;--ink:#f1eee9;--muted:#a39d94;--line:#2e2c29;--soft:#262421;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:0 6px 24px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff8a3d,#e2552d);display:grid;place-items:center;color:#fff;font-size:15px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 8px 8px}
.proj{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.proj:hover{background:var(--soft)}
.proj.on{background:var(--soft);font-weight:600}
.proj small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px}
main{padding:28px 32px 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:20px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:999px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;padding:0;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:9/16;background:var(--soft);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.strip{position:absolute;inset:0;background-size:auto 100%;background-position:0 0;background-repeat:no-repeat;transition:background-position .25s}
.card:hover .strip{background-position:16.6667% 0}
.thumb .num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.thumb .state{position:absolute;top:8px;right:8px}
.card .body{padding:10px 12px 12px}
.card h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .th{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b18}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok)}.b-todo{color:var(--muted)}.b-warn{color:var(--warn)}.b-run{color:var(--accent)}.b-bad{color:var(--bad)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
/* détail */
.sheet{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.sheet.open{display:flex}
.dlg{background:var(--panel);border-radius:20px;max-width:1040px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(260px,360px) 1fr;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.media{background:#0f0e0d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;border-radius:20px 0 0 20px}
#player{width:100%;max-width:330px}
.media video,.media img,.media object{width:100%;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.tabs{display:flex;gap:4px;background:#26231f;padding:4px;border-radius:10px}
.tabs button{border:0;background:none;color:#cfc8bd;padding:6px 12px;border-radius:7px;font-size:13px}
.tabs button.on{background:#f1eee9;color:#1d1b18}
.tabs button:disabled{opacity:.35;cursor:default}
.info{padding:26px 28px;min-width:0}
.info .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.info h2{margin:0;font-size:24px}
.close{border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.meta span{background:var(--soft);padding:4px 10px;border-radius:8px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-bottom:20px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:8px}
td.say{color:var(--muted)}
.issues{background:#fff6e0;color:#6b4a00;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:13.5px}
@media (prefers-color-scheme:dark){.issues{background:#3a2f12;color:#f3d48a}}
.issues ul{margin:6px 0 0;padding-left:18px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:11px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
pre.log{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap;margin-top:14px}
.preview{margin-top:20px}
.preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 16px} .dlg{grid-template-columns:1fr} .media{border-radius:20px 20px 0 0}
  .media video,.media img,.media object{max-width:300px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">▶</div>svgMaker Studio</div>
    <div class="label">Projets</div>
    <nav id="projects"></nav>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="pname">…</h1><p class="sub" id="pdesc"></p></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="bar">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Chercher un thème ou un mot (anglais ou thaï)…" autocomplete="off"></label>
      <div class="chips" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="dlg">
    <div class="media">
      <div id="player"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="info" id="info"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let projects = [], items = [], current = null, filter = 'all', openId = null, tab = 'video'

const FILTERS = [
  ['all', 'Toutes'], ['ready', 'Vidéo prête'], ['todo', 'À rendre'], ['warn', 'Alertes'],
]
const state = (i) =>
  i.job?.state === 'running' ? ['run', 'Rendu…'] :
  i.job?.state === 'error' ? ['bad', 'Erreur'] :
  !i.files.mp4 ? ['todo', 'À rendre'] :
  i.stale ? ['warn', 'À refaire'] :
  i.issues?.length ? ['warn', `${i.issues.length} alerte${i.issues.length > 1 ? 's' : ''}`] : ['ok', 'Prête']
const fileUrl = (rel) => rel && `/files/${encodeURIComponent(current)}/${rel.split('/').map(encodeURIComponent).join('/')}`
const fmtSize = (b) => b ? (b / 1e6).toFixed(1) + ' Mo' : ''
const fmtDate = (d) => d ? new Date(d).toLocaleString('fr-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''

async function loadProjects() {
  projects = await (await fetch('/api/projects')).json()
  current ??= new URLSearchParams(location.hash.slice(1)).get('p') || projects[0]?.id
  $('#projects').innerHTML = projects.map((p) =>
    `<button class="proj ${p.id === current ? 'on' : ''}" data-p="${esc(p.id)}">${esc(p.name)}<small>${p.rendered}/${p.count} vidéos</small></button>`).join('')
}

let lastJson = ''
async function loadItems() {
  const txt = await (await fetch(`/api/projects/${encodeURIComponent(current)}/items`)).text()
  if (txt === lastJson) return // rien n'a changé : pas de redessin (pas de clignotement)
  lastJson = txt
  items = JSON.parse(txt)
  render()
  if (openId) openItem(openId, true)
}

function matches(i, q) {
  if (!q) return true
  const hay = [i.id, i.title, i.subtitle, ...i.words.flatMap((w) => [w.en, w.th, w.say])].join(' ').toLowerCase()
  return q.toLowerCase().split(/\s+/).every((t) => hay.includes(t))
}

function render() {
  const p = projects.find((x) => x.id === current)
  $('#pname').textContent = p?.name ?? ''
  $('#pdesc').textContent = p?.description ?? ''
  const ready = items.filter((i) => i.files.mp4).length
  const words = items.reduce((a, i) => a + i.words.length, 0)
  const warn = items.filter((i) => state(i)[0] === 'warn').length
  $('#stats').innerHTML = [[items.length, 'thèmes'], [ready, 'vidéos prêtes'], [words, 'mots']]
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')
  const counts = { all: items.length, ready: items.filter((i) => state(i)[0] === 'ok').length, todo: items.length - ready, warn }
  $('#filters').innerHTML = FILTERS.map(([k, l]) => `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${l}<em>${counts[k]}</em></button>`).join('')

  const q = $('#q').value.trim()
  const list = items.filter((i) => matches(i, q)).filter((i) => {
    const s = state(i)[0]
    return filter === 'all' || (filter === 'ready' && s === 'ok') || (filter === 'todo' && !i.files.mp4) || (filter === 'warn' && s === 'warn')
  })
  $('#grid').innerHTML = list.length ? list.map((i) => {
    const [cls, lab] = state(i)
    // miniature : 1re image de la planche d'aperçu (intro), sinon couverture, sinon le SVG
    const thumb = i.files.preview
      ? `<div class="strip" style="background-image:url('${fileUrl(i.files.preview)}')"></div>`
      : (i.files.cover || i.files.svg) ? `<img loading="lazy" src="${fileUrl(i.files.cover || i.files.svg)}" alt="">` : ''
    return `<button class="card" data-id="${esc(i.id)}">
      <div class="thumb">${thumb}
        <span class="num">${esc(i.id.split('-')[0])}</span><span class="state"><span class="badge b-${cls}">${lab}</span></span></div>
      <div class="body"><h3>${esc(i.title)}</h3><div class="th">${esc(i.subtitle)}</div>
        <div class="dots">${i.words.map((w) => `<i style="background:${esc(w.color)}" title="${esc(w.en)}"></i>`).join('')}</div></div>
    </button>`
  }).join('') : `<div class="empty">Aucun résultat${q ? ` pour « ${esc(q)} »` : ''}.</div>`
}

function openItem(id, refresh = false) {
  const i = items.find((x) => x.id === id)
  if (!i) return
  openId = id
  if (!refresh) tab = i.files.mp4 ? 'video' : 'svg'
  const tabs = [['video', 'Vidéo', i.files.mp4], ['svg', 'SVG animé', i.files.svg], ['art', 'Dessins', i.files.art]]
  $('#tabs').innerHTML = tabs.map(([k, l, ok]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}" ${ok ? '' : 'disabled'}>${l}</button>`).join('')
  if (!refresh || !$('#player').dataset.k || $('#player').dataset.k !== `${id}:${tab}:${i.renderedAt}`) {
    $('#player').dataset.k = `${id}:${tab}:${i.renderedAt}`
    $('#player').innerHTML =
      tab === 'video' && i.files.mp4 ? `<video src="${fileUrl(i.files.mp4)}?v=${Date.parse(i.renderedAt)}" controls autoplay playsinline poster="${fileUrl(i.files.cover) ?? ''}"></video>` :
      tab === 'art' && i.files.art ? `<img src="${fileUrl(i.files.art)}" alt="" style="aspect-ratio:auto">` :
      i.files.svg ? `<img src="${fileUrl(i.files.svg)}?t=${Date.now()}" alt="SVG animé">` : ''
  }
  const [cls, lab] = state(i)
  const running = i.job?.state === 'running'
  $('#info').innerHTML = `
    <div class="top"><div><h2>${esc(i.title)}</h2><div class="sub">${esc(i.subtitle)}</div></div>
      <button class="close" data-close aria-label="Fermer">✕</button></div>
    <div class="meta"><span class="badge b-${cls}" style="background:var(--soft)">${lab}</span><span>${esc(i.id)}</span>
      ${i.duration ? `<span>${i.duration.toFixed(1)} s</span>` : ''}${i.size ? `<span>${fmtSize(i.size)}</span>` : ''}${i.renderedAt ? `<span>rendu ${fmtDate(i.renderedAt)}</span>` : ''}</div>
    ${i.words.length ? `<table><thead><tr><th>Anglais</th><th>Prononciation</th><th>Thaï</th></tr></thead><tbody>
      ${i.words.map((w) => `<tr><td><span class="sw" style="background:${esc(w.color)}"></span><b>${esc(w.en)}</b></td><td class="say">${esc(w.say)}</td><td>${esc(w.th)}</td></tr>`).join('')}
    </tbody></table>` : ''}
    ${i.issues?.length ? `<div class="issues"><b>Audit Reels</b><ul>${i.issues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${i.stale ? `<div class="issues">Le thème a été modifié après le dernier rendu : relance le rendu.</div>` : ''}
    <div class="actions">
      <button class="btn primary" data-render ${running ? 'disabled' : ''}>${running ? 'Rendu en cours…' : i.files.mp4 ? 'Refaire la vidéo' : 'Créer la vidéo'}</button>
      ${i.files.mp4 ? `<a class="btn" href="${fileUrl(i.files.mp4)}" download="${esc(i.id)}.mp4">Télécharger MP4</a>` : ''}
      ${i.files.cover ? `<a class="btn" href="${fileUrl(i.files.cover)}" download>Couverture</a>` : ''}
      ${i.files.svg ? `<a class="btn" href="${fileUrl(i.files.svg)}" target="_blank">Ouvrir le SVG</a>` : ''}
    </div>
    ${i.job?.log ? `<pre class="log">${esc(i.job.log.trim().split('\n').slice(-12).join('\n'))}</pre>` : ''}
    ${i.files.preview ? `<div class="preview"><div class="label" style="margin:0 0 8px">Aperçu des scènes</div><img src="${fileUrl(i.files.preview)}" alt=""></div>` : ''}`
  $('#sheet').classList.add('open')
  location.hash = `p=${current}&i=${id}`
}

function closeItem() { $('#sheet').classList.remove('open'); $('#player').innerHTML = ''; $('#player').dataset.k = ''; openId = null; location.hash = `p=${current}` }

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-p],[data-f],.card,[data-close],[data-t],[data-render]')
  if (!t) { if (e.target.id === 'sheet') closeItem(); return }
  if (t.dataset.p) { current = t.dataset.p; filter = 'all'; lastJson = ''; location.hash = `p=${current}`; await loadProjects(); await loadItems() }
  else if (t.dataset.f) { filter = t.dataset.f; render() }
  else if (t.classList.contains('card')) openItem(t.dataset.id)
  else if (t.hasAttribute('data-close')) closeItem()
  else if (t.dataset.t) { tab = t.dataset.t; $('#player').dataset.k = ''; openItem(openId, true) }
  else if (t.hasAttribute('data-render')) {
    await fetch(`/api/render?project=${encodeURIComponent(current)}&item=${encodeURIComponent(openId)}`, { method: 'POST' })
    lastJson = ''
    await loadItems()
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openId) closeItem()
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus() }
})
$('#q').addEventListener('input', render)

;(async () => {
  const h = new URLSearchParams(location.hash.slice(1))
  current = h.get('p')
  await loadProjects()
  await loadItems()
  if (h.get('i')) openItem(h.get('i'))
  // actualisation douce : rendus en cours, nouvelles vidéos produites par build.sh
  setInterval(async () => { if (!document.hidden) { await loadProjects(); await loadItems() } }, 4000)
})()
</script>
</body>
</html>
