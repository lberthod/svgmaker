<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svgMaker Studio</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1b18;--muted:#6f6a63;--line:#e6e2db;--soft:#efece6;
  --accent:#e2552d;--accent-ink:#fff;--ok:#2f9e5b;--warn:#c98a0b;--bad:#c8372d;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--panel:#1d1c1a;--ink:#f1eee9;--muted:#a39d94;--line:#2e2c29;--soft:#262421;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:0 6px 24px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff8a3d,#e2552d);display:grid;place-items:center;color:#fff;font-size:15px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 8px 8px}
.proj{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.proj:hover{background:var(--soft)}
.proj.on{background:var(--soft);font-weight:600}
.proj small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px}
main{padding:28px 32px 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:20px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:999px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;padding:0;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:9/16;background:var(--soft);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.strip{position:absolute;inset:0;background-size:auto 100%;background-position:0 0;background-repeat:no-repeat;transition:background-position .25s}
.card:hover .strip{background-position:16.6667% 0}
.thumb .num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.thumb .state{position:absolute;top:8px;right:8px}
.card .body{padding:10px 12px 12px}
.card h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .th{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b18}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok)}.b-todo{color:var(--muted)}.b-warn{color:var(--warn)}.b-run{color:var(--accent)}.b-bad{color:var(--bad)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
/* détail */
.sheet{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.sheet.open{display:flex}
.dlg{background:var(--panel);border-radius:20px;max-width:1040px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(260px,360px) 1fr;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.media{background:#0f0e0d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;border-radius:20px 0 0 20px}
#player{width:100%;max-width:330px}
.media video,.media img,.media object{width:100%;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.tabs{display:flex;gap:4px;background:#26231f;padding:4px;border-radius:10px}
.tabs button{border:0;background:none;color:#cfc8bd;padding:6px 12px;border-radius:7px;font-size:13px}
.tabs button.on{background:#f1eee9;color:#1d1b18}
.tabs button:disabled{opacity:.35;cursor:default}
.info{padding:26px 28px;min-width:0}
.info .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.info h2{margin:0;font-size:24px}
.close{border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.meta span{background:var(--soft);padding:4px 10px;border-radius:8px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-bottom:20px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:8px}
td.say{color:var(--muted)}
.issues{background:#fff6e0;color:#6b4a00;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:13.5px}
@media (prefers-color-scheme:dark){.issues{background:#3a2f12;color:#f3d48a}}
.issues ul{margin:6px 0 0;padding-left:18px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:11px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
pre.log{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap;margin-top:14px}
.preview{margin-top:20px}
.preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
button.brand{border:0;background:none;color:inherit;padding:0;font:inherit;font-weight:700;font-size:17px}
/* accueil */
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.hero h1{font-size:32px}
.hero .sub{font-size:16px;max-width:560px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:34px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec h2{font-size:19px;margin:0}
.sec span{color:var(--muted);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-bottom:38px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.collage{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--soft);height:190px;overflow:hidden;cursor:pointer;border:0;padding:0}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.collage .ph{background:var(--soft)}
.pcard .pb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.pcard h3{margin:0;font-size:18px}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px}
.pmeta span{background:var(--soft);padding:3px 9px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pact{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:38px}
.rc{border:0;padding:0;background:none;color:inherit;text-align:left}
.rc img,.rc .ph{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;display:block;background:var(--soft);border:1px solid var(--line);transition:transform .15s}
.rc:hover img{transform:translateY(-2px)}
.rc b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{color:var(--muted);font-size:12px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
.tip b{display:block;margin-bottom:4px}
.tip code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12.5px}
/* lecture continue (« Tout lire ») */
.playall{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600}
.playall:disabled{opacity:.45;cursor:default}
.tv{position:fixed;inset:0;background:#0b0a09;color:#f1eee9;display:none;flex-direction:column;z-index:20}
.tv.open{display:flex}
.tv-top{display:flex;align-items:center;gap:14px;padding:14px 20px}
.tv-top .t{flex:1;min-width:0}
.tv-top h2{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-top .s{color:#a39d94;font-size:13px}
.tv-count{background:#26231f;padding:5px 11px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums}
.tv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px}
.tv-stage video{height:100%;max-height:100%;max-width:100%;aspect-ratio:9/16;border-radius:14px;background:#000}
.tv-bottom{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px 18px;flex-wrap:wrap}
.tv button{border:0;background:#26231f;color:#f1eee9;padding:10px 16px;border-radius:11px;font-weight:600}
.tv button:hover{background:#36322c}
.tv .next-up{color:#a39d94;font-size:13px;min-width:0;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .bar-prog{height:3px;background:#26231f}
.tv .bar-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.libsel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 10px;font:inherit;font-size:14px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:18px}
.art{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;border:1px solid var(--line);background:#fff;text-decoration:none;color:#3B2A20;transition:transform .12s,box-shadow .12s}
.art:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.art img{width:100%;aspect-ratio:1;object-fit:contain;background:#FFFBF0;border-radius:10px}
.art b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art small{font-size:11px;color:#8a8178;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .sw{display:flex;gap:3px}.art .sw i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.libmore{grid-column:1/-1;justify-self:center;margin:8px 0 24px}
@media (max-width:820px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 16px} .dlg{grid-template-columns:1fr} .media{border-radius:20px 20px 0 0}
  .media video,.media img,.media object{max-width:300px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <button class="brand" data-home><div class="logo">▶</div>svgMaker Studio</button>
    <button class="proj home-link" id="homelink" data-home>Accueil<small>Vue d'ensemble</small></button>
    <div class="label" style="margin-top:18px">Projets</div>
    <nav id="projects"></nav>
    <div class="label" style="margin-top:18px">Boîte à outils</div>
    <button class="proj" id="liblink" data-lib>Bibliothèque<small id="libcount">dessins partagés</small></button>
  </aside>
  <main id="libview" hidden>
    <div class="head">
      <div><h1>Bibliothèque de dessins</h1><p class="sub">Les dessins de <code>library/</code>, réutilisables par toutes les séries : <code>"art": "&lt;id&gt;"</code> dans un thème.</p></div>
      <div class="stats" id="libstats"></div>
    </div>
    <div class="bar">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="libq" type="search" placeholder="Chercher un dessin, une catégorie, une source…" autocomplete="off"></label>
      <select id="libcat" class="libsel" aria-label="Catégorie"></select>
      <select id="libstyle" class="libsel" aria-label="Style"><option value="">Tous les styles</option><option value="kids">kids-english-th</option><option value="mali">Mali</option></select>
    </div>
    <div class="artgrid" id="artgrid"></div>
  </main>
  <main id="home" hidden></main>
  <main id="projview" hidden>
    <div class="head">
      <div><h1 id="pname">…</h1><p class="sub" id="pdesc"></p></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="bar">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Chercher un thème ou un mot (anglais ou thaï)…" autocomplete="off"></label>
      <div class="chips" id="filters"></div>
      <button class="playall" id="playall" title="Lire à la suite toutes les vidéos affichées">▶ Tout lire</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="dlg">
    <div class="media">
      <div id="player"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="info" id="info"></div>
  </div>
</div>

<div class="tv" id="tv" role="dialog" aria-modal="true" aria-label="Lecture continue">
  <div class="bar-prog"><i id="tv-prog"></i></div>
  <div class="tv-top">
    <div class="t"><h2 id="tv-title"></h2><div class="s" id="tv-sub"></div></div>
    <span class="tv-count" id="tv-count"></span>
    <button id="tv-close" aria-label="Quitter la lecture continue">✕ Quitter</button>
  </div>
  <div class="tv-stage"><video id="tv-video" controls autoplay playsinline></video></div>
  <div class="tv-bottom">
    <button id="tv-prev">⏮ Précédente</button>
    <button id="tv-next">Suivante ⏭</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#a39d94"><input type="checkbox" id="tv-loop"> en boucle</label>
    <span class="next-up" id="tv-upnext"></span>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let projects = [], items = [], current = null, filter = 'all', openId = null, tab = 'video'

const FILTERS = [
  ['all', 'Toutes'], ['ready', 'Vidéo prête'], ['todo', 'À rendre'], ['warn', 'Alertes'],
]
const state = (i) =>
  i.job?.state === 'running' ? ['run', 'Rendu…'] :
  i.job?.state === 'error' ? ['bad', 'Erreur'] :
  !i.files.mp4 ? ['todo', 'À rendre'] :
  i.stale ? ['warn', 'À refaire'] :
  i.issues?.length ? ['warn', `${i.issues.length} alerte${i.issues.length > 1 ? 's' : ''}`] : ['ok', 'Prête']
const fileUrl = (rel) => rel && `/files/${encodeURIComponent(current)}/${rel.split('/').map(encodeURIComponent).join('/')}`
const fmtSize = (b) => b ? (b / 1e6).toFixed(1) + ' Mo' : ''
const fmtDate = (d) => d ? new Date(d).toLocaleString('fr-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''

async function loadProjects() {
  projects = await (await fetch('/api/projects')).json()
  $('#homelink').classList.toggle('on', !current && !libOpen)
  $('#projects').innerHTML = projects.map((p) =>
    `<button class="proj ${p.id === current ? 'on' : ''}" data-p="${esc(p.id)}">${esc(p.name)}<small>${p.rendered}/${p.count} vidéos</small></button>`).join('')
  if (!current) renderHome()
}

// ---------------------------------------------------------------- accueil
const pUrl = (pid, rel) => rel && `/files/${encodeURIComponent(pid)}/${rel.split('/').map(encodeURIComponent).join('/')}`
const fmtDur = (s) => !s ? '–' : s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.round((s % 3600) / 60)).padStart(2, '0')}` : `${Math.round(s / 60)} min`
const fmtBytes = (b) => !b ? '–' : b >= 1e9 ? (b / 1e9).toFixed(1) + ' Go' : Math.round(b / 1e6) + ' Mo'
const ago = (d) => {
  if (!d) return 'jamais'
  const m = Math.round((Date.now() - new Date(d)) / 60000)
  return m < 1 ? 'à l’instant' : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j`
}
let lastHome = ''
function renderHome() {
  const sum = (k) => projects.reduce((a, p) => a + (p[k] ?? 0), 0)
  const key = JSON.stringify(projects)
  if (key === lastHome && !$('#home').hidden) return
  lastHome = key
  const recent = projects.flatMap((p) => p.recent.map((r) => ({ ...r, pid: p.id, pname: p.name })))
    .sort((a, b) => new Date(b.renderedAt) - new Date(a.renderedAt)).slice(0, 12)
  const h = new Date().getHours()
  $('#home').innerHTML = `
    <div class="hero">
      <div><h1>${h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir'} 👋</h1>
        <p class="sub">Tes SVG animés et les vidéos qui en sortent : choisis un projet, regarde une vidéo ou lance-les toutes à la suite.</p></div>
    </div>
    <div class="kpis">
      ${[[projects.length, 'projets'], [sum('rendered'), 'vidéos prêtes'], [sum('words'), 'mots enseignés'],
        [fmtDur(sum('duration')), 'de vidéo'], [fmtBytes(sum('bytes')), 'de masters'], [sum('warn'), 'à vérifier']]
        .map(([n, l]) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('')}
    </div>
    <div class="sec"><h2>Projets</h2><span>${projects.length} au total</span></div>
    <div class="pgrid">${projects.map((p) => {
      const c = [...p.covers, null, null, null, null].slice(0, 4)
      const pct = p.count ? Math.round((p.rendered / p.count) * 100) : 0
      return `<article class="pcard">
        <button class="collage" data-p="${esc(p.id)}" aria-label="Ouvrir ${esc(p.name)}">${c.map((x) => x ? `<img loading="lazy" src="${pUrl(p.id, x)}" alt="">` : '<div class="ph"></div>').join('')}</button>
        <div class="pb">
          <h3>${esc(p.name)}</h3>
          <p>${esc(p.description)}</p>
          <div class="pmeta"><span>${p.rendered}/${p.count} vidéos</span>${p.words ? `<span>${p.words} mots</span>` : ''}${p.duration ? `<span>${fmtDur(p.duration)}</span>` : ''}<span>${fmtBytes(p.bytes)}</span><span>rendu ${ago(p.lastRender)}</span>${p.warn ? `<span style="color:var(--warn)">${p.warn} à vérifier</span>` : ''}</div>
          <div class="prog" title="${pct} % rendu"><i style="width:${pct}%"></i></div>
          <div class="pact"><button class="btn primary" data-p="${esc(p.id)}">Ouvrir</button>${p.rendered ? `<button class="btn" data-playproj="${esc(p.id)}">▶ Tout lire</button>` : ''}</div>
        </div></article>`
    }).join('')}</div>
    ${recent.length ? `<div class="sec"><h2>Derniers rendus</h2><span>tous projets</span></div>
    <div class="recent">${recent.map((r) => `<button class="rc" data-open="${esc(r.pid)}|${esc(r.id)}">
      ${r.cover ? `<img loading="lazy" src="${pUrl(r.pid, r.cover)}" alt="">` : '<div class="ph"></div>'}
      <b>${esc(r.title)}</b><small>${ago(r.renderedAt)}</small></button>`).join('')}</div>` : ''}
    <div class="sec"><h2>Raccourcis</h2></div>
    <div class="tips">
      <div class="tip"><b>Rendre un SVG en vidéo</b><code>svgmaker render mon.svg --audit</code></div>
      <div class="tip"><b>Ajouter un projet</b>Ajoute une entrée dans <code>studio.json</code> (id, nom, dossier) : le Studio le liste aussitôt.</div>
      <div class="tip"><b>Clavier</b><code>/</code> chercher · <code>←</code> <code>→</code> vidéo précédente / suivante · <code>Échap</code> fermer</div>
    </div>`
}

function showView() {
  $('#home').hidden = !!current || libOpen
  $('#projview').hidden = !current
  $('#libview').hidden = !libOpen
  $('#liblink').classList.toggle('on', libOpen)
  if (!current && !libOpen) { lastHome = ''; renderHome() }
}

// ---------------------------------------------------------------- bibliothèque de dessins
let libOpen = false, arts = null, libLimit = 240
const libUrl = (file) => `/library/${file.split('/').map(encodeURIComponent).join('/')}`
async function goLibrary() {
  current = null; libOpen = true; location.hash = 'lib'
  showView(); await loadProjects()
  if (!arts) {
    arts = await (await fetch('/api/library')).json()
    const cats = [...new Set(arts.map((a) => a.cat))].sort()
    $('#libcat').innerHTML = `<option value="">Toutes les catégories (${cats.length})</option>` + cats.map((c) => `<option>${esc(c)}</option>`).join('')
  }
  renderLibrary(); window.scrollTo(0, 0)
}
function renderLibrary() {
  const q = $('#libq').value.trim().toLowerCase(), cat = $('#libcat').value, style = $('#libstyle').value
  const list = arts.filter((a) => (!cat || a.cat === cat) && (!style || a.tags.includes(style)) &&
    (!q || `${a.id} ${a.cat} ${a.source} ${a.tags.join(' ')}`.toLowerCase().includes(q)))
  $('#libstats').innerHTML = `<div class="stat"><b>${arts.length}</b><span>dessins</span></div><div class="stat"><b>${new Set(arts.map((a) => a.cat)).size}</b><span>catégories</span></div><div class="stat"><b>${list.length}</b><span>affichés</span></div>`
  $('#artgrid').innerHTML = list.slice(0, libLimit).map((a) => `<a class="art" href="${libUrl(a.file)}" target="_blank" title="${esc(a.id)} · ${esc(a.source)}">
      <img loading="lazy" src="${libUrl(a.file)}" alt="${esc(a.id)}">
      <b>${esc(a.id)}</b><small>${esc(a.cat)}</small>
      <span class="sw">${a.colors.slice(0, 8).map((c) => `<i style="background:${esc(c)}"></i>`).join('')}</span></a>`).join('') +
    (list.length > libLimit ? `<button class="btn libmore" data-libmore>Afficher ${Math.min(240, list.length - libLimit)} de plus (${list.length - libLimit} restants)</button>` : '') +
    (!list.length ? '<p class="sub">Aucun dessin ne correspond.</p>' : '')
}
for (const s of ['#libq', '#libcat', '#libstyle']) $(s).addEventListener('input', () => { libLimit = 240; renderLibrary() })

async function goProject(id, openAfter) {
  libOpen = false
  current = id; filter = 'all'; lastJson = ''; $('#q').value = ''
  location.hash = id ? `p=${id}` : ''
  showView(); await loadProjects()
  if (id) { await loadItems(); window.scrollTo(0, 0); if (openAfter) openItem(openAfter) }
}

let lastJson = ''
async function loadItems() {
  if (!current) return
  const txt = await (await fetch(`/api/projects/${encodeURIComponent(current)}/items`)).text()
  if (txt === lastJson) return // rien n'a changé : pas de redessin (pas de clignotement)
  lastJson = txt
  items = JSON.parse(txt)
  render()
  if (openId) openItem(openId, true)
}

function matches(i, q) {
  if (!q) return true
  const hay = [i.id, i.title, i.subtitle, ...i.words.flatMap((w) => [w.en, w.th, w.say])].join(' ').toLowerCase()
  return q.toLowerCase().split(/\s+/).every((t) => hay.includes(t))
}

// vidéos affichées (recherche + filtre), dans l'ordre de la grille
function visible() {
  const q = $('#q').value.trim()
  return items.filter((i) => matches(i, q)).filter((i) => {
    const s = state(i)[0]
    return filter === 'all' || (filter === 'ready' && s === 'ok') || (filter === 'todo' && !i.files.mp4) || (filter === 'warn' && s === 'warn')
  })
}

// ---------------------------------------------------------------- lecture continue
let tv = null // { list, pos, project }
function tvStart(startId) {
  const list = visible().filter((i) => i.files.mp4)
  if (!list.length) return
  if (openId) closeItem()
  tv = { list, project: current, pos: Math.max(0, list.findIndex((i) => i.id === startId)) }
  $('#tv').classList.add('open')
  tvShow()
}
function tvShow() {
  const { list, pos } = tv, i = list[pos], nx = list[pos + 1] ?? ($('#tv-loop').checked ? list[0] : null)
  const v = $('#tv-video')
  v.poster = i.files.cover ? fileUrl(i.files.cover) : ''
  v.src = `${fileUrl(i.files.mp4)}?v=${Date.parse(i.renderedAt)}`
  v.play().catch(() => {})
  $('#tv-title').textContent = i.title
  $('#tv-sub').textContent = [i.subtitle, i.words.map((w) => w.en).join(' · ')].filter(Boolean).join('  —  ')
  $('#tv-count').textContent = `${pos + 1} / ${list.length}`
  $('#tv-prog').style.width = `${((pos + 1) / list.length) * 100}%`
  $('#tv-upnext').textContent = nx ? `Ensuite : ${nx.title}` : 'Dernière vidéo'
  $('#tv-prev').disabled = pos === 0
  location.hash = `p=${tv.project}&play=${encodeURIComponent(i.id)}`
}
function tvGo(d) {
  if (!tv) return
  let p = tv.pos + d
  if (p >= tv.list.length) { if (!$('#tv-loop').checked) return tvStop(); p = 0 }
  if (p < 0) return
  tv.pos = p
  tvShow()
}
function tvStop() {
  if (!tv) return
  const v = $('#tv-video'); v.pause(); v.removeAttribute('src'); v.load()
  $('#tv').classList.remove('open')
  tv = null
  location.hash = `p=${current}`
}
$('#tv-video').addEventListener('ended', () => tvGo(1))
$('#tv-next').onclick = () => tvGo(1)
$('#tv-prev').onclick = () => tvGo(-1)
$('#tv-close').onclick = tvStop
$('#playall').onclick = () => tvStart()

function render() {
  const p = projects.find((x) => x.id === current)
  $('#pname').textContent = p?.name ?? ''
  $('#pdesc').textContent = p?.description ?? ''
  const ready = items.filter((i) => i.files.mp4).length
  const words = items.reduce((a, i) => a + i.words.length, 0)
  const warn = items.filter((i) => state(i)[0] === 'warn').length
  $('#stats').innerHTML = [[items.length, 'thèmes'], [ready, 'vidéos prêtes'], [words, 'mots']]
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')
  const counts = { all: items.length, ready: items.filter((i) => state(i)[0] === 'ok').length, todo: items.length - ready, warn }
  $('#filters').innerHTML = FILTERS.map(([k, l]) => `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${l}<em>${counts[k]}</em></button>`).join('')

  const q = $('#q').value.trim()
  const list = visible()
  const playable = list.filter((i) => i.files.mp4).length
  $('#playall').disabled = !playable
  $('#playall').textContent = `▶ Tout lire (${playable})`
  $('#grid').innerHTML = list.length ? list.map((i) => {
    const [cls, lab] = state(i)
    // miniature : 1re image de la planche d'aperçu (intro), sinon couverture, sinon le SVG
    const thumb = i.files.thumb ? `<img loading="lazy" src="${fileUrl(i.files.thumb)}" alt="">` : i.files.preview
      ? `<div class="strip" style="background-image:url('${fileUrl(i.files.preview)}')"></div>`
      : (i.files.cover || i.files.svg) ? `<img loading="lazy" src="${fileUrl(i.files.cover || i.files.svg)}" alt="">` : ''
    return `<button class="card" data-id="${esc(i.id)}">
      <div class="thumb">${thumb}
        <span class="num">${esc(i.id.split('-')[0])}</span><span class="state"><span class="badge b-${cls}">${lab}</span></span></div>
      <div class="body"><h3>${esc(i.title)}</h3><div class="th">${esc(i.subtitle)}</div>
        <div class="dots">${i.words.map((w) => `<i style="background:${esc(w.color)}" title="${esc(w.en)}"></i>`).join('')}</div></div>
    </button>`
  }).join('') : `<div class="empty">Aucun résultat${q ? ` pour « ${esc(q)} »` : ''}.</div>`
}

function openItem(id, refresh = false) {
  const i = items.find((x) => x.id === id)
  if (!i) return
  openId = id
  if (!refresh) tab = i.files.mp4 ? 'video' : 'svg'
  const tabs = [['video', 'Vidéo', i.files.mp4], ['svg', 'SVG animé', i.files.svg], ['art', 'Dessins', i.files.art]]
  $('#tabs').innerHTML = tabs.map(([k, l, ok]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}" ${ok ? '' : 'disabled'}>${l}</button>`).join('')
  if (!refresh || !$('#player').dataset.k || $('#player').dataset.k !== `${id}:${tab}:${i.renderedAt}`) {
    $('#player').dataset.k = `${id}:${tab}:${i.renderedAt}`
    $('#player').innerHTML =
      tab === 'video' && i.files.mp4 ? `<video src="${fileUrl(i.files.mp4)}?v=${Date.parse(i.renderedAt)}" controls autoplay playsinline poster="${fileUrl(i.files.cover) ?? ''}"></video>` :
      tab === 'art' && i.files.art ? `<img src="${fileUrl(i.files.art)}" alt="" style="aspect-ratio:auto">` :
      i.files.svg ? `<img src="${fileUrl(i.files.svg)}?t=${Date.now()}" alt="SVG animé">` : ''
  }
  const [cls, lab] = state(i)
  const running = i.job?.state === 'running'
  $('#info').innerHTML = `
    <div class="top"><div><h2>${esc(i.title)}</h2><div class="sub">${esc(i.subtitle)}</div></div>
      <button class="close" data-close aria-label="Fermer">✕</button></div>
    <div class="meta"><span class="badge b-${cls}" style="background:var(--soft)">${lab}</span><span>${esc(i.id)}</span>
      ${i.duration ? `<span>${i.duration.toFixed(1)} s</span>` : ''}${i.size ? `<span>${fmtSize(i.size)}</span>` : ''}${i.renderedAt ? `<span>rendu ${fmtDate(i.renderedAt)}</span>` : ''}</div>
    ${i.words.length ? `<table><thead><tr><th>Anglais</th><th>Prononciation</th><th>Thaï</th></tr></thead><tbody>
      ${i.words.map((w) => `<tr><td><span class="sw" style="background:${esc(w.color)}"></span><b>${esc(w.en)}</b></td><td class="say">${esc(w.say)}</td><td>${esc(w.th)}</td></tr>`).join('')}
    </tbody></table>` : ''}
    ${i.issues?.length ? `<div class="issues"><b>Audit Reels</b><ul>${i.issues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${i.stale ? `<div class="issues">Le thème a été modifié après le dernier rendu : relance le rendu.</div>` : ''}
    <div class="actions">
      <button class="btn primary" data-render ${running ? 'disabled' : ''}>${running ? 'Rendu en cours…' : i.files.mp4 ? 'Refaire la vidéo' : 'Créer la vidéo'}</button>
      ${i.files.mp4 ? `<button class="btn" data-playfrom="${esc(i.id)}">▶ Tout lire depuis ici</button>` : ''}
      ${i.files.mp4 ? `<a class="btn" href="${fileUrl(i.files.mp4)}" download="${esc(i.id)}.mp4">Télécharger MP4</a>` : ''}
      ${i.files.cover ? `<a class="btn" href="${fileUrl(i.files.cover)}" download>Couverture</a>` : ''}
      ${i.files.svg ? `<a class="btn" href="${fileUrl(i.files.svg)}" target="_blank">Ouvrir le SVG</a>` : ''}
    </div>
    ${i.job?.log ? `<pre class="log">${esc(i.job.log.trim().split('\n').slice(-12).join('\n'))}</pre>` : ''}
    ${i.files.preview ? `<div class="preview"><div class="label" style="margin:0 0 8px">Aperçu des scènes</div><img src="${fileUrl(i.files.preview)}" alt=""></div>` : ''}`
  $('#sheet').classList.add('open')
  location.hash = `p=${current}&i=${id}`
}

function closeItem() { $('#sheet').classList.remove('open'); $('#player').innerHTML = ''; $('#player').dataset.k = ''; openId = null; location.hash = `p=${current}` }

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-p],[data-f],.card,[data-close],[data-t],[data-render],[data-playfrom],[data-home],[data-playproj],[data-open],[data-lib],[data-libmore]')
  if (!t) { if (e.target.id === 'sheet') closeItem(); return }
  if (t.hasAttribute('data-lib')) goLibrary()
  else if (t.hasAttribute('data-libmore')) { libLimit += 240; renderLibrary() }
  else if (t.dataset.playfrom) tvStart(t.dataset.playfrom)
  else if (t.hasAttribute('data-home')) goProject(null)
  else if (t.dataset.playproj) { await goProject(t.dataset.playproj); tvStart() }
  else if (t.dataset.open) { const [pid, iid] = t.dataset.open.split('|'); goProject(pid, iid) }
  else if (t.dataset.p) goProject(t.dataset.p)
  else if (t.dataset.f) { filter = t.dataset.f; render() }
  else if (t.classList.contains('card')) openItem(t.dataset.id)
  else if (t.hasAttribute('data-close')) closeItem()
  else if (t.dataset.t) { tab = t.dataset.t; $('#player').dataset.k = ''; openItem(openId, true) }
  else if (t.hasAttribute('data-render')) {
    await fetch(`/api/render?project=${encodeURIComponent(current)}&item=${encodeURIComponent(openId)}`, { method: 'POST' })
    lastJson = ''
    await loadItems()
  }
})
document.addEventListener('keydown', (e) => {
  if (tv) {
    if (e.key === 'Escape') tvStop()
    else if (e.key === 'ArrowRight' || e.key === 'n') tvGo(1)
    else if (e.key === 'ArrowLeft' || e.key === 'p') tvGo(-1)
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); const v = $('#tv-video'); v.paused ? v.play() : v.pause() }
    return
  }
  if (e.key === 'Escape' && openId) closeItem()
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus() }
})
$('#q').addEventListener('input', render)

;(async () => {
  const h = new URLSearchParams(location.hash.slice(1))
  current = h.get('p')
  if (h.has('lib')) { await goLibrary() }
  showView()
  await loadProjects()
  if (current && !projects.some((p) => p.id === current)) { current = null; showView(); await loadProjects() }
  await loadItems()
  if (h.get('i')) openItem(h.get('i'))
  else if (h.get('play')) tvStart(h.get('play'))
  // actualisation douce : rendus en cours, nouvelles vidéos produites par build.sh
  setInterval(async () => { if (!document.hidden) { await loadProjects(); await loadItems() } }, 4000)
})()
</script>
</body>
